<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <aside class="sidebar">
      <div class="brand-mark" aria-hidden="true">hoshinohito</div>
      <p class="brand-name">Tarkov Memo</p>
      <p class="brand-note">小さな記録室</p>
      <nav class="menu" aria-label="メインメニュー">
        <a href="{{ '/' | relative_url }}">サイトトップ</a>
        <a href="{{ '/tarkov/' | relative_url }}">タルコフメモ</a>
        <a href="{{ '/links/' | relative_url }}">リンク集</a>
        <div class="menu-heading">記事一覧</div>
        <div class="menu-posts">
          {% for post in site.posts %}
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          {% else %}
            <span class="menu-empty">まだ記事はありません</span>
          {% endfor %}
        </div>
      </nav>
      <div class="sidebar-footer">est. 2026<br><span>/// private notes</span></div>
    </aside>
    <main class="content">
      <div class="content-inner">
        <header class="page-header">
          <p class="eyebrow">{{ page.section | default: 'PERSONAL NOTE SPACE' }}</p>
          <h1>{{ page.title }}</h1>
        </header>
        {{ content }}
        <footer class="site-footer">
          <span class="footer-copy">{{ site.title }} <span>·</span> memo archive</span>
          <span class="social-links" aria-label="ソーシャルリンク">
            <a href="https://x.com/tanakamitaina" target="_blank" rel="noopener noreferrer" aria-label="X" title="X">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </a>
            <a href="https://www.twitch.tv/hoshinohito" target="_blank" rel="noopener noreferrer" aria-label="Twitch" title="Twitch">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2h18v13l-5 5h-4l-3 3v-3H3V2zm2 2v14h5v2.2l2.2-2.2H15l4-4V4H5zm3 3h2v5H8V7zm6 0h2v5h-2V7z"/></svg>
            </a>
          </span>
        </footer>
      </div>
    </main>
  </div>
</body>
</html>
