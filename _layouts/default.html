<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <aside class="sidebar">
      <div class="brand-mark" aria-hidden="true">TM</div>
      <p class="brand-name">Tarkov Memo</p>
      <p class="brand-note">小さな記録室</p>
      <nav class="menu" aria-label="メインメニュー">
        <a href="{{ '/' | relative_url }}">サイトトップ</a>
        <a href="{{ '/tarkov/' | relative_url }}">タルコフメモ</a>
        <a href="{{ '/links/' | relative_url }}">リンク集</a>
        <div class="menu-heading">記事一覧</div>
        <div class="menu-posts">
          {% for post in site.posts %}
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          {% else %}
            <span class="menu-empty">まだ記事はありません</span>
          {% endfor %}
        </div>
      </nav>
      <div class="sidebar-footer">est. 2026<br><span>/// private notes</span></div>
    </aside>
    <main class="content">
      <div class="content-inner">
        <header class="page-header">
          <p class="eyebrow">{{ page.section | default: 'PERSONAL NOTE SPACE' }}</p>
          <h1>{{ page.title }}</h1>
        </header>
        {{ content }}
        <footer class="site-footer">{{ site.title }} <span>·</span> memo archive</footer>
      </div>
    </main>
  </div>
</body>
</html>
